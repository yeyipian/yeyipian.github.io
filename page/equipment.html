        // 分类图标映射
        const categoryIcons = {
            digital: "laptop",
            audio: "headphones",
            wearable: "clock",
            other: "gift",
            mi: "fa-home"
        };

        // 分类名称映射
        const categoryNames = {
            digital: "数码产品",
            audio: "音频设备",
            wearable: "智能穿戴",
            other: "其他装备",
            mi: "小米之家"
        };

        // 渲染装备卡片
        function renderEquipment(category = 'all') {
            const container = document.getElementById('equipment-container');
            container.innerHTML = '';

            const filteredEquipment = category === 'all'
                ? equipmentData
                : equipmentData.filter(item => {
                    // 确保category是数组
                    const categories = Array.isArray(item.category) ? item.category : [item.category];
                    // 判断装备的分类数组中是否包含目标分类
                    return categories.includes(category);
                });

            filteredEquipment.forEach(item => {
                const card = document.createElement('div');
                card.className = 'equipment-card';
                // 确保category是数组
                const categories = Array.isArray(item.category) ? item.category : [item.category];
                card.setAttribute('data-category', categories.join(' '));

                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="equipment-image">
                    <div class="equipment-info">
                        <div style="display: flex;flex-direction: row;align-items: flex-end;">
                        <div class="card-icon">
                            <i class="fas fa-${item.icon}"></i>
                        </div>
                        <span class="equipment-category">
                            ${categories.map(cat => categoryNames[cat]).join(' / ')} 
                        </span>                        </div>

                        <h3 class="equipment-name">${item.name}</h3>
                        <p class="equipment-desc">${item.description}</p>
                        <div class="equipment-specs">
                            ${item.specs.map(spec => `<span class="spec-tag">${spec}</span>`).join('')}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function () {
            // 渲染所有装备
            renderEquipment();

            // 分类筛选功能
            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    // 阻止事件冒泡，确保点击有效
                    e.stopPropagation();
                    
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const category = tab.getAttribute('data-category');
                    renderEquipment(category);
                });
            });

            // 平滑滚动
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        window.scrollTo({
                            top: target.offsetTop - 80,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        });
